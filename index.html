<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naval Arena - Combat Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { touch-action: manipulation; user-select: none; }
        body { font-family: 'Share Tech Mono', monospace; background-color: #030814; color: #00f0ff; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .radar-grid { 
            background-image: linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px); 
            background-size: 5% 5%; 
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 radar-grid overflow-hidden">

    <!-- Top Status Bar -->
    <header class="w-full max-w-md flex justify-between items-center px-3 py-1 bg-slate-900/90 border border-cyan-500/30 rounded-lg text-xs">
        <div>SALA: <span id="display-room" class="text-yellow-400 font-bold">---</span></div>
        <div class="text-center font-orbitron text-cyan-400 font-bold">NAVAL ARENA</div>
        <div>JOGADORES: <span id="display-count" class="text-green-400 font-bold">0/5</span></div>
    </header>

    <!-- Main Container: Game Canvas & Overlays -->
    <div class="relative w-full max-w-md aspect-square flex items-center justify-center my-auto">
        
        <!-- Game Canvas -->
        <canvas id="gameCanvas" class="w-full h-full border-2 border-cyan-500/50 rounded-lg bg-slate-950/80 shadow-lg shadow-cyan-500/10"></canvas>

        <!-- Countdown Overlay -->
        <div id="countdown-overlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center rounded-lg z-20">
            <div id="countdown-number" class="text-7xl font-extrabold font-orbitron text-cyan-400 animate-bounce">3</div>
            <div class="text-sm font-orbitron text-cyan-500 tracking-widest mt-2">PREPARAR PARA O COMBATE!</div>
        </div>

        <!-- Lobby / Join Modal -->
        <div id="lobby-modal" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-4 rounded-lg border border-cyan-500/40 z-30">
            <h2 class="text-xl font-bold font-orbitron text-cyan-400 mb-1">COMBATE NAVAL</h2>
            <p class="text-slate-400 text-xs mb-4 text-center">Digite o mesmo código de sala nos 5 celulares.</p>
            
            <div class="w-full space-y-3 px-4">
                <div>
                    <label class="text-xs text-cyan-500">SEU NOME / PATENTE:</label>
                    <input type="text" id="player-name" maxlength="10" placeholder="Ex: CMG_MAGNO" class="w-full bg-slate-900 border border-cyan-500/50 rounded px-3 py-2 text-cyan-300 text-sm focus:outline-none focus:border-cyan-400 uppercase">
                </div>
                <div>
                    <label class="text-xs text-cyan-500">CÓDIGO DA SALA (IGUAL PARA TODOS):</label>
                    <input type="text" id="room-code" maxlength="8" value="MARINHA1" class="w-full bg-slate-900 border border-cyan-500/50 rounded px-3 py-2 text-yellow-400 font-bold text-sm focus:outline-none focus:border-cyan-400 uppercase">
                </div>
                
                <button onclick="enterLobby()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold font-orbitron rounded text-sm tracking-wider shadow-lg transition-all">
                    ENTRAR NA SALA DE ESPERA
                </button>
            </div>
        </div>

        <!-- Waiting Room Overlay -->
        <div id="waiting-modal" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-4 rounded-lg border border-yellow-500/40 z-30">
            <h3 class="text-lg font-bold font-orbitron text-yellow-400 mb-1">SALAS DE ESPERA</h3>
            <p id="waiting-status" class="text-xs text-slate-400 mb-3 text-center">Aguardando participantes entrarem...</p>
            
            <div id="player-list" class="w-full max-w-xs space-y-1 mb-4 text-xs font-mono">
                <!-- Lista de jogadores dinamicamente inserida -->
            </div>

            <button id="start-btn" onclick="triggerStart()" class="w-full max-w-xs py-3 bg-green-500 hover:bg-green-400 text-slate-950 font-bold font-orbitron rounded text-sm tracking-wider transition-all shadow-lg shadow-green-500/30">
                INICIAR BATALHA (TODOS)
            </button>
        </div>
    </div>

    <!-- Mobile D-Pad Controls -->
    <footer class="w-full max-w-md pb-2">
        <div class="grid grid-cols-3 gap-1.5 w-44 mx-auto">
            <div></div>
            <button onclick="changeDir('UP')" class="bg-slate-900/90 border border-cyan-500/40 py-3 rounded text-center text-cyan-400 text-lg active:bg-cyan-500/30 font-bold">▲</button>
            <div></div>
            <button onclick="changeDir('LEFT')" class="bg-slate-900/90 border border-cyan-500/40 py-3 rounded text-center text-cyan-400 text-lg active:bg-cyan-500/30 font-bold">◄</button>
            <button onclick="changeDir('DOWN')" class="bg-slate-900/90 border border-cyan-500/40 py-3 rounded text-center text-cyan-400 text-lg active:bg-cyan-500/30 font-bold">▼</button>
            <button onclick="changeDir('RIGHT')" class="bg-slate-900/90 border border-cyan-500/40 py-3 rounded text-center text-cyan-400 text-lg active:bg-cyan-500/30 font-bold">►</button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_UNITS = 20; // 20x20 permanente para todos os celulares
        
        let pubnub = null;
        let myId = 'p_' + Math.random().toString(36).substr(2, 6);
        let myName = '';
        let roomCode = '';
        let myColor = '#00f0ff';

        let navio = { x: 5, y: 5, dx: 1, dy: 0, body: [], score: 0, alive: true };
        let roomState = { players: {}, gameState: 'LOBBY' };
        let crate = { x: 10, y: 10 };
        let gameLoop = null;

        const COLORS = ['#00f0ff', '#ff007f', '#ffe600', '#00ff66', '#ff6600'];

        function enterLobby() {
            myName = document.getElementById('player-name').value.trim() || 'CMD_' + myId.substr(0,3);
            roomCode = document.getElementById('room-code').value.trim().toUpperCase() || 'MARINHA1';
            myColor = COLORS[Math.floor(Math.random() * COLORS.length)];

            document.getElementById('display-room').innerText = roomCode;
            document.getElementById('lobby-modal').classList.add('hidden');
            document.getElementById('waiting-modal').classList.remove('hidden');

            // Configurar PubNub para sincronização em tempo real
            pubnub = new PubNub({
                publishKey: 'pub-c-4fa2e5bb-76f2-4663-8a3d-a5170d4949bd',
                subscribeKey: 'sub-c-1349fbc0-4e11-47ef-a031-64539659b8d9',
                userId: myId
            });

            pubnub.subscribe({ channels: ['naval_' + roomCode] });

            pubnub.addListener({
                message: (m) => {
                    const data = m.message;
                    if (data.type === 'JOIN') {
                        roomState.players[m.publisher] = data.player;
                        updateWaitingRoom();
                    } else if (data.type === 'START_SIGNAL') {
                        startCountdown();
                    } else if (data.type === 'POS_UPDATE') {
                        if (m.publisher !== myId) {
                            roomState.players[m.publisher] = data.player;
                        }
                    }
                }
            });

            // Enviar presença na sala
            sendMsg({ type: 'JOIN', player: { name: myName, color: myColor, score: 0 } });
            document.addEventListener('keydown', handleKey);
            resizeCanvas();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function updateWaitingRoom() {
            const list = document.getElementById('player-list');
            const count = Object.keys(roomState.players).length;
            document.getElementById('display-count').innerText = `${count}/5`;
            
            list.innerHTML = Object.values(roomState.players).map(p => 
                `<div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded border border-slate-800">
                    <span style="color:${p.color}">⚓ ${p.name}</span>
                    <span class="text-green-400 text-xs">PRONTO</span>
                </div>`
            ).join('');
        }

        function triggerStart() {
            sendMsg({ type: 'START_SIGNAL' });
        }

        function startCountdown() {
            document.getElementById('waiting-modal').classList.add('hidden');
            const overlay = document.getElementById('countdown-overlay');
            const num = document.getElementById('countdown-number');
            overlay.classList.remove('hidden');

            let count = 3;
            num.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    num.innerText = count;
                } else if (count === 0) {
                    num.innerText = 'FOGO!';
                } else {
                    clearInterval(timer);
                    overlay.classList.add('hidden');
                    runGame();
                }
            }, 1000);
        }

        function runGame() {
            // Posicionar o navio do jogador em local seguro baseado na ordem
            const pKeys = Object.keys(roomState.players);
            const myIndex = pKeys.indexOf(myId) >= 0 ? pKeys.indexOf(myId) : 0;
            navio.x = (myIndex * 4 + 2) % GRID_UNITS;
            navio.y = (myIndex * 4 + 2) % GRID_UNITS;
            navio.body = [{ x: navio.x, y: navio.y }];

            gameLoop = setInterval(update, 120);
        }

        function sendMsg(msg) {
            if (pubnub) pubnub.publish({ channel: 'naval_' + roomCode, message: msg });
        }

        function handleKey(e) {
            if (e.key === 'ArrowUp' || e.key === 'w') changeDir('UP');
            if (e.key === 'ArrowDown' || e.key === 's') changeDir('DOWN');
            if (e.key === 'ArrowLeft' || e.key === 'a') changeDir('LEFT');
            if (e.key === 'ArrowRight' || e.key === 'd') changeDir('RIGHT');
        }

        function changeDir(dir) {
            if (dir === 'UP' && navio.dy === 0) { navio.dx = 0; navio.dy = -1; }
            if (dir === 'DOWN' && navio.dy === 0) { navio.dx = 0; navio.dy = 1; }
            if (dir === 'LEFT' && navio.dx === 0) { navio.dx = -1; navio.dy = 0; }
            if (dir === 'RIGHT' && navio.dx === 0) { navio.dx = 1; navio.dy = 0; }
        }

        function update() {
            if (!navio.alive) return;

            navio.x += navio.dx;
            navio.y += navio.dy;

            // Teleporte pelas paredes (Wrap-Around)
            if (navio.x < 0) navio.x = GRID_UNITS - 1;
            if (navio.x >= GRID_UNITS) navio.x = 0;
            if (navio.y < 0) navio.y = GRID_UNITS - 1;
            if (navio.y >= GRID_UNITS) navio.y = 0;

            navio.body.unshift({ x: navio.x, y: navio.y });

            // Coleta de suprimentos
            if (navio.x === crate.x && navio.y === crate.y) {
                navio.score += 50;
                crate.x = Math.floor(Math.random() * GRID_UNITS);
                crate.y = Math.floor(Math.random() * GRID_UNITS);
            } else {
                if (navio.body.length > 3 + Math.floor(navio.score / 50)) {
                    navio.body.pop();
                }
            }

            // Checar colisão com rastro de outros navios (PvP)
            Object.entries(roomState.players).forEach(([pid, p]) => {
                if (pid !== myId && p.body) {
                    p.body.forEach(seg => {
                        if (navio.x === seg.x && navio.y === seg.y) {
                            navio.alive = false; // Afundou
                        }
                    });
                }
            });

            // Transmitir posição atual
            sendMsg({
                type: 'POS_UPDATE',
                player: {
                    x: navio.x, y: navio.y, dx: navio.dx, dy: navio.dy,
                    body: navio.body, name: myName, score: navio.score,
                    color: myColor, alive: navio.alive
                }
            });

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cellSize = canvas.width / GRID_UNITS;

            // Desenhar Suprimento
            ctx.fillStyle = '#ffe600';
            ctx.fillRect(crate.x * cellSize + 2, crate.y * cellSize + 2, cellSize - 4, cellSize - 4);

            // Desenhar Outros Navios
            Object.values(roomState.players).forEach(p => {
                if (p.body && p.alive !== false) {
                    drawTrail(p.body, p.color, cellSize);
                    drawHead(p.x, p.y, p.dx, p.dy, p.color, p.name, cellSize);
                }
            });

            // Desenhar Meu Navio
            if (navio.alive) {
                drawTrail(navio.body, myColor, cellSize);
                drawHead(navio.x, navio.y, navio.dx, navio.dy, myColor, myName, cellSize);
            }
        }

        function drawTrail(body, color, size) {
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.35;
            body.slice(1).forEach(seg => {
                ctx.beginPath();
                ctx.arc(seg.x * size + size/2, seg.y * size + size/2, size/3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawHead(x, y, dx, dy, color, name, size) {
            ctx.save();
            ctx.translate(x * size + size/2, y * size + size/2);

            let angle = 0;
            if (dx === 1) angle = 0;
            if (dx === -1) angle = Math.PI;
            if (dy === 1) angle = Math.PI / 2;
            if (dy === -1) angle = -Math.PI / 2;
            ctx.rotate(angle);

            // Casco do Navio de Guerra
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(size/2 - 2, 0);
            ctx.lineTo(-size/3, -size/3);
            ctx.lineTo(-size/3, size/3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Nome do Comandante
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px Share Tech Mono';
            ctx.textAlign = 'center';
            ctx.fillText(name, x * size + size/2, y * size - 3);
        }

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
