<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naval Arena - Combat Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Share Tech Mono', monospace; background-color: #030814; color: #00f0ff; overflow: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        canvas { background: radial-gradient(circle at center, #07172b 0%, #030a14 100%); border: 2px solid #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
        .radar-grid { background-image: linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 radar-grid">

    <!-- Header & Radar Dashboard -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-2 px-4 py-2 bg-slate-900/80 border border-cyan-500/30 rounded-lg backdrop-blur">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="text-xl font-bold font-orbitron tracking-wider text-cyan-400">NAVAL ARENA <span class="text-xs text-cyan-600">v2.0</span></h1>
        </div>
        <div class="flex space-x-6 text-sm">
            <div>SALA: <span id="display-room" class="text-yellow-400 font-bold">---</span></div>
            <div>PONTOS: <span id="display-score" class="text-green-400 font-bold">0</span></div>
            <div>STATUS: <span id="display-status" class="text-cyan-400">Desconectado</span></div>
        </div>
    </header>

    <!-- Main Game Canvas -->
    <div class="relative flex flex-col items-center">
        <canvas id="gameCanvas" width="800" height="500" class="rounded-lg shadow-2xl"></canvas>

        <!-- Overlay Modal (Lobby) -->
        <div id="lobby-modal" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 rounded-lg border border-cyan-500/40">
            <h2 class="text-2xl font-bold font-orbitron text-cyan-400 mb-2">COMBATE NAVAL MULTIPLAYER</h2>
            <p class="text-slate-400 text-xs mb-6 text-center max-w-md">Navegue pelas águas, atrevesse as bordas do mar sem colidir e destrua os navios inimigos cruzando a esteira de espuma!</p>
            
            <div class="w-full max-w-xs space-y-4">
                <div>
                    <label class="text-xs text-cyan-500 uppercase">Identificação do Comandante:</label>
                    <input type="text" id="player-name" maxlength="12" placeholder="Ex: CMG_GABRIEL" class="w-full bg-slate-900 border border-cyan-500/50 rounded px-3 py-2 text-cyan-300 focus:outline-none focus:border-cyan-400 uppercase">
                </div>
                <div>
                    <label class="text-xs text-cyan-500 uppercase">Código da Sala (5 Jogadores):</label>
                    <input type="text" id="room-code" maxlength="8" value="MARINHA1" class="w-full bg-slate-900 border border-cyan-500/50 rounded px-3 py-2 text-yellow-400 font-bold focus:outline-none focus:border-cyan-400 uppercase">
                </div>
                <button onclick="joinGame()" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold font-orbitron rounded tracking-widest transition-all shadow-lg shadow-cyan-500/30">
                    ENTRAR NA ARENA
                </button>
            </div>
        </div>
    </div>

    <!-- Controles Mobile -->
    <div class="mt-4 grid grid-cols-3 gap-2 w-48 md:hidden">
        <div></div>
        <button onclick="changeDir('UP')" class="bg-slate-800 border border-cyan-500/40 p-3 rounded text-center text-cyan-400 text-xl active:bg-cyan-500/20">▲</button>
        <div></div>
        <button onclick="changeDir('LEFT')" class="bg-slate-800 border border-cyan-500/40 p-3 rounded text-center text-cyan-400 text-xl active:bg-cyan-500/20">◄</button>
        <button onclick="changeDir('DOWN')" class="bg-slate-800 border border-cyan-500/40 p-3 rounded text-center text-cyan-400 text-xl active:bg-cyan-500/20">▼</button>
        <button onclick="changeDir('RIGHT')" class="bg-slate-800 border border-cyan-500/40 p-3 rounded text-center text-cyan-400 text-xl active:bg-cyan-500/20">►</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20;
        const COLS = canvas.width / GRID_SIZE;
        const ROWS = canvas.height / GRID_SIZE;

        let pubnub = null;
        let myId = 'p_' + Math.random().toString(36).substr(2, 6);
        let myName = '';
        let roomCode = '';
        let myColor = '#00f0ff';
        
        let navio = { x: 10, y: 10, dx: 1, dy: 0, body: [], score: 0 };
        let otherPlayers = {};
        let crate = { x: 15, y: 15 };
        let gameLoop = null;

        const COLORS = ['#00f0ff', '#ff007f', '#ffe600', '#00ff66', '#ff6600'];

        function joinGame() {
            myName = document.getElementById('player-name').value.trim() || 'CMD_' + myId.substr(0,4);
            roomCode = document.getElementById('room-code').value.trim().toUpperCase() || 'MARINHA1';
            myColor = COLORS[Math.floor(Math.random() * COLORS.length)];

            document.getElementById('display-room').innerText = roomCode;
            document.getElementById('lobby-modal').classList.add('hidden');
            document.getElementById('display-status').innerText = 'EM OPERAÇÃO';

            // PubNub para tempo real sem servidor próprio
            pubnub = new PubNub({
                publishKey: 'pub-c-4fa2e5bb-76f2-4663-8a3d-a5170d4949bd',
                subscribeKey: 'sub-c-1349fbc0-4e11-47ef-a031-64539659b8d9',
                userId: myId
            });

            pubnub.subscribe({ channels: ['naval_' + roomCode] });

            pubnub.addListener({
                message: (m) => {
                    if (m.publisher !== myId) {
                        otherPlayers[m.publisher] = m.message;
                    }
                }
            });

            document.addEventListener('keydown', handleKey);
            gameLoop = setInterval(update, 100);
        }

        function handleKey(e) {
            if (e.key === 'ArrowUp' || e.key === 'w') changeDir('UP');
            if (e.key === 'ArrowDown' || e.key === 's') changeDir('DOWN');
            if (e.key === 'ArrowLeft' || e.key === 'a') changeDir('LEFT');
            if (e.key === 'ArrowRight' || e.key === 'd') changeDir('RIGHT');
        }

        function changeDir(dir) {
            if (dir === 'UP' && navio.dy === 0) { navio.dx = 0; navio.dy = -1; }
            if (dir === 'DOWN' && navio.dy === 0) { navio.dx = 0; navio.dy = 1; }
            if (dir === 'LEFT' && navio.dx === 0) { navio.dx = -1; navio.dy = 0; }
            if (dir === 'RIGHT' && navio.dx === 0) { navio.dx = 1; navio.dy = 0; }
        }

        function update() {
            // Avançar navio
            navio.x += navio.dx;
            navio.y += navio.dy;

            // Teleporte pelas paredes do mar (Wrap-around)
            if (navio.x < 0) navio.x = COLS - 1;
            if (navio.x >= COLS) navio.x = 0;
            if (navio.y < 0) navio.y = ROWS - 1;
            if (navio.y >= ROWS) navio.y = 0;

            // Esteira do navio
            navio.body.unshift({ x: navio.x, y: navio.y });

            // Coleta de suprimento
            if (navio.x === crate.x && navio.y === crate.y) {
                navio.score += 50;
                document.getElementById('display-score').innerText = navio.score;
                crate.x = Math.floor(Math.random() * COLS);
                crate.y = Math.floor(Math.random() * ROWS);
            } else {
                if (navio.body.length > 4 + Math.floor(navio.score / 50)) {
                    navio.body.pop();
                }
            }

            // Transmitir posição para os outros 4 jogadores
            if (pubnub) {
                pubnub.publish({
                    channel: 'naval_' + roomCode,
                    message: {
                        x: navio.x, y: navio.y,
                        dx: navio.dx, dy: navio.dy,
                        body: navio.body,
                        name: myName,
                        score: navio.score,
                        color: myColor
                    }
                });
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Suprimento Marítimo
            ctx.fillStyle = '#ffe600';
            ctx.fillRect(crate.x * GRID_SIZE + 4, crate.y * GRID_SIZE + 4, GRID_SIZE - 8, GRID_SIZE - 8);

            // Desenhar Outros Navios
            Object.values(otherPlayers).forEach(p => {
                drawShipTrail(p.body, p.color);
                drawShipHead(p.x, p.y, p.dx, p.dy, p.color, p.name);
            });

            // Desenhar Meu Navio
            drawShipTrail(navio.body, myColor);
            drawShipHead(navio.x, navio.y, navio.dx, navio.dy, myColor, myName);
        }

        function drawShipTrail(body, color) {
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.4;
            body.slice(1).forEach(seg => {
                ctx.beginPath();
                ctx.arc(seg.x * GRID_SIZE + 10, seg.y * GRID_SIZE + 10, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawShipHead(x, y, dx, dy, color, name) {
            ctx.save();
            ctx.translate(x * GRID_SIZE + 10, y * GRID_SIZE + 10);
            
            let angle = 0;
            if (dx === 1) angle = 0;
            if (dx === -1) angle = Math.PI;
            if (dy === 1) angle = Math.PI / 2;
            if (dy === -1) angle = -Math.PI / 2;
            ctx.rotate(angle);

            // Casco do Navio
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(8, 0);
            ctx.lineTo(-6, -5);
            ctx.lineTo(-6, 5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Nome do Jogador
            ctx.fillStyle = '#ffffff';
            ctx.font = '9px Share Tech Mono';
            ctx.fillText(name, x * GRID_SIZE - 5, y * GRID_SIZE - 4);
        }
    </script>
</body>
</html>
